# Monthly, grouped pull requests for new versions of the build's dependencies and of the GitHub Actions the
# workflows use: the Compose BOM itself is released monthly. Security fixes don't wait for this schedule: Dependabot
# security updates open them as soon as a vulnerability is published. Each update is a reviewed pull request that CI
# must pass. A Gradle update also needs its lock file refreshed (`./gradlew :qeetrix:dependencies --write-locks`)
# before it can merge (docs/decisions.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: develop
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    target-branch: develop
    open-pull-requests-limit: 5
    groups:
      androidx-and-compose:
        patterns: ["androidx.*", "com.android.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "org.jetbrains.kotlinx*", "org.jetbrains.dokka*"]
      testing:
        patterns: ["org.robolectric*", "io.github.takahirom.roborazzi*", "junit*", "com.google.android.apps.common.testing*"]
