name: CI

# Pull requests are checked once, and main again after each merge; a push to develop is covered by its pull request.
# The device tests (two emulators, the slow part) run on pull requests into main and on main; everyday pull requests
# into develop run the fast checks.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: confirm the pinned upstream artifacts still match the lock.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      instrumented:
        description: Also run the instrumented tests on an emulator
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The SDK packages Phase 1 was verified with (AGP 9.4's maximum API level and default build tools).
  ANDROID_PLATFORM: "platforms;android-37.0"
  ANDROID_BUILD_TOOLS: "build-tools;36.0.0"

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS" platform-tools > /dev/null
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Pull requests read the cache; only main writes it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # Lint, ktlint, every JVM test (behaviour, accessibility semantics, Compose UI), the generator's tests and drift
      # check, the public API check, and test coverage (fails below 92 % of lines).
      - name: Lint and tests
        run: ./gradlew check :qeetrix:koverVerifyDebug
      # The sample's release build is minified as an app's would be, so R8 runs over the library.
      - name: Build the library and the sample
        run: ./gradlew :qeetrix:assembleRelease :sample:assembleRelease :qeetrix:assembleDebugAndroidTest
      # What an app receives: the AAR's contents, and the POM and module metadata of a local publication.
      - name: Check the package apps receive
        run: |
          Scripts/verify-aar qeetrix/build/outputs/aar/qeetrix-release.aar
          ./gradlew :qeetrix:publishReleasePublicationToReleaseCandidateRepository -Pqeetrix.version=0.0.0-ci
          Scripts/verify-publication build/release-candidate/maven 0.0.0-ci qeetrix/build/outputs/aar/qeetrix-release.aar
      - name: Reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/

  upstream:
    name: Pinned upstream still matches the lock
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - name: Re-fetch the pinned artifacts and compare them with the lock (network)
        run: ./gradlew -p Tools/QeetrixGen run --args="sync --root $GITHUB_WORKSPACE --check"

  # On every push and pull request (and on demand): the device-only checks — Back on popups and stacked overlays,
  # the Accessibility Test Framework over every component, number formats under Android's ICU, a long keyed list —
  # on the minimum supported API level and on API 36, the level the accessibility checks were verified to run on
  # (they are left out below it: docs/decisions.md).
  instrumented:
    name: Device tests on API ${{ matrix.api-level }}
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'workflow_dispatch' && inputs.instrumented)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS" platform-tools > /dev/null
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - name: connectedDebugAndroidTest
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew :qeetrix:connectedDebugAndroidTest
      - name: Instrumented-test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumented-reports-api-${{ matrix.api-level }}
          path: qeetrix/build/reports/androidTests/
