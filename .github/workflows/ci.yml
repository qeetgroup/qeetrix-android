name: CI

# Verify, once per change: on every pull request into develop (Dependabot's, a contributor's) and on the
# develop → main pull request, which is what main takes. Pushes run nothing, so no commit is checked twice.
#
# Verify is the quick gate: the Gradle wrapper, generated files against the upstream lock, the Kotlin compile (library,
# its tests, the extended icons and the sample), ktlint and Android lint. The JVM tests and coverage, the public API
# check, the release builds, the package checks, the icon budget and the device tests run locally before pushing
# (CONTRIBUTING.md, "Before you push"); the release builds and verifies the artifacts again before it publishes.
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The SDK packages Phase 1 was verified with (AGP 9.4's maximum API level and default build tools).
  ANDROID_PLATFORM: "platforms;android-37.0"
  ANDROID_BUILD_TOOLS: "build-tools;36.0.0"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS" platform-tools > /dev/null
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # CI runs only on pull requests now, so a pull request keeps its own cache for its later pushes.
          cache-read-only: false
      - name: Generated files and the upstream lock
        run: Scripts/verify-tokens
      - name: Compile (library, its tests, the extended icons and the sample)
        run: ./gradlew :qeetrix:compileDebugUnitTestKotlin :qeetrix-icons-extended:compileDebugKotlin :sample:compileDebugKotlin
      - name: Formatting (ktlint)
        run: ./gradlew ktlintCheck
      - name: Android lint
        run: ./gradlew lint
      - name: Reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: "**/build/reports/"
