name: Version

# Raises the patch of `qeetrix.version` in gradle.properties on a pull request into main, so the version a merge
# releases is in the pull request's diff and reviewed like any other change: the Qeetrix release flow, as in
# qeetrix-react.
#
# Want a minor or major release instead? Edit `qeetrix.version` yourself. This workflow only acts while the pull
# request's version still equals main's, so a version raised by hand is left alone. A breaking API change before 1.0
# needs a minor (docs/releases.md).
#
# It never checks out the pull request's code: it reads and writes the one file through the GitHub API, so a token
# that can push never sits beside untrusted code.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: version-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bump:
    name: Raise the version unless it is raised
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # A fork's pull request gets a read-only token and can't be pushed to, and the bot's own commit must not bump again.
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    permissions:
      contents: write
      actions: write # start CI on the bumped commit (the last step)
    steps:
      - id: bump
        name: Raise the patch unless the version is already raised
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          version_at() {
            gh api "repos/$repo/contents/gradle.properties?ref=$1" --jq .content 2>/dev/null | base64 -d \
              | sed -n 's/^qeetrix\.version=//p'
          }
          tag_exists() { gh api "repos/$repo/git/ref/tags/v$1" > /dev/null 2>&1; }

          # A pull request can be merged before this runs; its head is then already in the base branch.
          status=$(gh api "repos/$repo/compare/$BASE...$HEAD_REF" --jq .status)
          if [ "$status" = "identical" ] || [ "$status" = "behind" ]; then
            echo "This pull request's head is already in $BASE. Nothing to raise."; exit 0
          fi

          current=$(version_at "$HEAD_REF")
          base=$(version_at "$BASE" || true)
          echo "This pull request: $current"
          echo "$BASE: ${base:-none}"
          if [ -z "$base" ]; then
            echo "$BASE has no version yet: $current is the first release. Leaving it alone."; exit 0
          fi
          if [ "$current" != "$base" ]; then
            echo "Version already raised in this pull request. Leaving it alone."; exit 0
          fi

          # The next patch (or, after a release candidate, the next candidate) that has no tag yet.
          next="$base"
          while tag_exists "$next" || [ "$next" = "$base" ]; do
            if [[ "$next" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-rc\.([0-9]+)$ ]]; then
              next="${BASH_REMATCH[1]}-rc.$((BASH_REMATCH[2] + 1))"
            else
              IFS=. read -r major minor patch <<< "$next"
              next="$major.$minor.$((patch + 1))"
            fi
          done
          echo "Raising $current -> $next"

          # Commit the one-line change on the pull request's branch. The file's blob SHA makes it fail, rather than
          # overwrite, if the branch moved meanwhile; the next push runs this again.
          file=$(gh api "repos/$repo/contents/gradle.properties?ref=$HEAD_REF")
          sha=$(jq -r .sha <<< "$file")
          content=$(jq -r .content <<< "$file" | base64 -d | sed "s/^qeetrix\.version=.*/qeetrix.version=$next/" | base64 -w0)
          gh api -X PUT "repos/$repo/contents/gradle.properties" \
            -f message="chore: bump version to $next" -f content="$content" -f sha="$sha" -f branch="$HEAD_REF" > /dev/null
          echo "bumped=true" >> "$GITHUB_OUTPUT"

      # A commit made with this workflow's token starts no other workflow, so start CI on it explicitly, device tests
      # included: its result is what branch protection checks.
      - name: Run CI on the bumped commit
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${{ github.head_ref }}" --repo "${{ github.repository }}" -f instrumented=true
