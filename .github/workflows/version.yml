name: Version

# Raises the patch of `qeetrix.version` in gradle.properties on a pull request into main, so the version a merge
# releases is in the pull request's diff and reviewed like any other change: the Qeetrix release flow, as in
# qeetrix-react.
#
# Want a minor or major release instead? Edit `qeetrix.version` yourself. This workflow only acts while the pull
# request's version still equals main's, so a version raised by hand is left alone. A breaking API change before 1.0
# needs a minor (Documentation/Releases/RELEASE-POLICY.md).
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: version-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bump:
    name: Raise the version unless it is raised
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # A fork's pull request gets a read-only token and can't be pushed to, and the bot's own commit must not bump again.
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    permissions:
      contents: write
      actions: write # start CI on the bumped commit (the last step)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - id: bump
        name: Raise the patch unless the version is already raised
        env:
          BASE: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          # A pull request can be merged before this runs; its head is then already in the base branch.
          if git merge-base --is-ancestor HEAD "origin/$BASE"; then
            echo "This pull request's head is already in $BASE. Nothing to raise."; exit 0
          fi
          current=$(sed -n 's/^qeetrix\.version=//p' gradle.properties)
          base=$(git show "origin/$BASE:gradle.properties" 2>/dev/null | sed -n 's/^qeetrix\.version=//p' || true)
          echo "This pull request: $current"
          echo "$BASE: ${base:-none}"
          if [ -z "$base" ]; then
            echo "$BASE has no version yet: $current is the first release. Leaving it alone."; exit 0
          fi
          if [ "$current" != "$base" ]; then
            echo "Version already raised in this pull request. Leaving it alone."; exit 0
          fi

          # The next patch (or, after a release candidate, the next candidate) that has no tag yet.
          next="$base"
          while git rev-parse -q --verify "refs/tags/v$next" >/dev/null || [ "$next" = "$base" ]; do
            if [[ "$next" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-rc\.([0-9]+)$ ]]; then
              next="${BASH_REMATCH[1]}-rc.$((BASH_REMATCH[2] + 1))"
            else
              IFS=. read -r major minor patch <<< "$next"
              next="$major.$minor.$((patch + 1))"
            fi
          done
          echo "Raising $current -> $next"
          sed -i "s/^qeetrix\.version=.*/qeetrix.version=$next/" gradle.properties

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "chore: bump version to $next"
          git push origin "HEAD:$HEAD_REF"
          echo "bumped=true" >> "$GITHUB_OUTPUT"

      # A commit pushed with this workflow's token starts no other workflow, so start CI on it explicitly: its result is
      # what branch protection checks.
      - name: Run CI on the bumped commit
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${{ github.head_ref }}" --repo "${{ github.repository }}"
