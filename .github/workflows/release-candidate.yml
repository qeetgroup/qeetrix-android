name: Release candidate

# Builds and verifies a release candidate with Scripts/release-candidate and keeps the result — the local Maven
# repository, its archive and the evidence (provenance, checksums, dependency inventory, logs) — as a workflow artifact
# for review. It publishes nothing: this workflow has no registry, credential or upload step. Publishing a reviewed
# candidate is a separate step that needs the owner's approval (Documentation/Releases/MAVEN-DISTRIBUTION.md).
# Device tests run in CI's instrumented job; screenshot baselines are local and are compared on a maintainer's machine.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version, X.Y.Z-rc.N
        required: true
        type: string

permissions:
  contents: read

env:
  ANDROID_PLATFORM: "platforms;android-37.0"
  ANDROID_BUILD_TOOLS: "build-tools;36.0.0"

jobs:
  candidate:
    name: Verify release candidate ${{ inputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS" platform-tools > /dev/null
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - name: Build and verify the candidate (publishes to build/release-candidate/maven only)
        env:
          VERSION: ${{ inputs.version }}
        run: Scripts/release-candidate "$VERSION"
      - name: Candidate and evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ inputs.version }}
          path: build/release-candidate/
          retention-days: 30
