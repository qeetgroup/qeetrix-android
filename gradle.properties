# The version the next release publishes (Documentation/Releases/RELEASE-POLICY.md). Change it in the pull request
# into main: the Version workflow raises the patch when a pull request leaves it unchanged, and merging to main
# releases it. A command-line -Pqeetrix.version (release-candidate trials, CI's 0.0.0-ci) overrides it.
qeetrix.version=0.1.0

# Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official

# Android
android.useAndroidX=true
# Each library's R class contains only its own resources, so :qeetrix cannot reach a resource it does
# not declare and the sample cannot reach :qeetrix's resources through its own R.
android.nonTransitiveRClass=true

# Screenshot tests (Roborazzi) neither record nor verify in an ordinary test run: the baselines in
# src/test/screenshots are local and not committed. Record and review them with
# `./gradlew :qeetrix:recordRoborazziDebug`; verify with `./gradlew :qeetrix:verifyRoborazziDebug`.
