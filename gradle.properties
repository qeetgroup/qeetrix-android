# Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official

# Android
android.useAndroidX=true
# Each library's R class contains only its own resources, so :qeetrix cannot reach a resource it does
# not declare and the sample cannot reach :qeetrix's resources through its own R.
android.nonTransitiveRClass=true
